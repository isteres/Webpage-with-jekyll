name: Build and Deploy Jekyll Site

# Definir los disparadores del workflow: en un push o pull request a la rama 'main'
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # Puedes cambiarlo por otro sistema operativo si lo prefieres

    steps:
    # Paso 1: Checkout del código
    - name: Checkout code
      uses: actions/checkout@v2  # Este paso descarga el código fuente de tu repositorio

    # Paso 2: Configuración de Ruby
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.7  # Usa Ruby 2.7 (compatible con Jekyll 4.x.x)
        bundler: 2.2  # Especifica la versión de Bundler que deseas usar

    # Paso 3: Instalar dependencias de Ruby
    - name: Install dependencies
      run: |
        gem install bundler # Instalar bundler si no está disponible
        bundle install  # Instalar todas las gemas definidas en el Gemfile

    # Paso 4: Construir el sitio con Jekyll
    - name: Build Jekyll site
      run: bundle exec jekyll build  # Construir el sitio Jekyll

    # Paso 5: Desplegar en GitHub Pages (si usas esta opción)
    - name: Deploy to GitHub Pages
      run: |
        bundle exec jekyll deploy  # Desplegar el sitio generado a GitHub Pages
      if: github.ref == 'refs/heads/main'  # Solo desplegar si el push es en la rama 'main'

    # Paso opcional: Subir artefactos de construcción si deseas almacenarlos
    - name: Upload build artifact
      if: success()  # Solo subir artefactos si la construcción es exitosa
      uses: actions/upload-artifact@v2
      with:
        name: jekyll-build
        path: _site  # Carpeta generada con los archivos del sitio


